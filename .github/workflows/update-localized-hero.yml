name: Update localized hero images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-localized-hero.yml

permissions:
  contents: write

jobs:
  update-hero-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update English and Hungarian image paths
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('en/index.html'): (
                  '../cb7d238e-e234-4ddc-bc8c-7518169182a2.png',
                  '../49b39320-1922-496e-8680-a4c485a6531f.png',
              ),
              Path('hu/index.html'): (
                  '../cb7d238e-e234-4ddc-bc8c-7518169182a2.png',
                  '../6d4a7ee6-21c6-415d-9755-d28cfc9d6571.png',
              ),
          }

          for path, (old, new) in changes.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected image path not found in {path}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/update-localized-hero.yml').unlink()
          PY

      - name: Commit updated index files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/index.html hu/index.html .github/workflows/update-localized-hero.yml
          git commit -m "Update English and Hungarian hero images"
          git push
