name: Clean Hungarian price paragraph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-hu-price-paragraph.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover space
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('hu/arak.html')
          workflow = Path('.github/workflows/cleanup-hu-price-paragraph.yml')
          old = 'Kezdő ár és árazási módszer. </p>'
          new = 'Kezdő ár és árazási módszer.</p>'
          text = path.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Expected Hungarian paragraph was not found.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          workflow.unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Clean Hungarian pricing paragraph"
          git push
