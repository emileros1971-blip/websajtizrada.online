name: Remove Serbian and Hungarian final price notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-sr-hu-final-price-notes.yml

permissions:
  contents: write

jobs:
  remove-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove translated sentences everywhere
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/remove-sr-hu-final-price-notes.yml')
          replacements = [
              ('<small>Konačna cena zavisi od obima i funkcionalnosti.</small>', ''),
              ('Konačna cena zavisi od obima i funkcionalnosti — precizna ponuda nakon kratkog razgovora.', 'Precizna ponuda nakon kratkog razgovora.'),
              ('Konačna cena zavisi od obima i funkcionalnosti.', ''),
              ('<small>A végső ár a terjedelemtől és funkcióktól függ.</small>', ''),
              ('A végső ár a terjedelemtől és funkcióktól függ.', ''),
          ]
          text_extensions = {'.html', '.htm', '.md', '.txt', '.json', '.js', '.css', '.xml', '.yml', '.yaml'}
          changed = []
          total = 0

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              updated = text
              count_for_file = 0
              for old, new in replacements:
                  count = updated.count(old)
                  if count:
                      updated = updated.replace(old, new)
                      count_for_file += count

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  total += count_for_file

          if total == 0:
              raise SystemExit('No Serbian or Hungarian target sentence was found.')

          workflow.unlink()
          print(f'Removed {total} occurrence(s) from: {", ".join(changed)}')
          PY

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Remove Serbian and Hungarian final price notes"
          git push
