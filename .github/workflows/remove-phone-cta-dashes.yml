name: Remove phone CTA dashes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-phone-cta-dashes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove misplaced dashes before phone numbers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/remove-phone-cta-dashes.yml')
          pattern = re.compile(r'\s*[—–]\s*(?=<span\s+data-cfg-phone\b)')
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(' ', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((str(path), count))

          if not changed:
              raise SystemExit('No misplaced phone CTA dashes were found.')

          print('Updated files:')
          for path, count in changed:
              print(f'  {path}: {count}')

          workflow.unlink()
          PY

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Remove misplaced dashes from phone CTA buttons"
          git push
