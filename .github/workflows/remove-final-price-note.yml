name: Remove final price note

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-final-price-note.yml

permissions:
  contents: write

jobs:
  remove-note:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove the sentence everywhere
        run: |
          python - <<'PY'
          from pathlib import Path

          sentence = 'Final price depends on scope and features.'
          wrapped = f'<small>{sentence}</small>'
          workflow = Path('.github/workflows/remove-final-price-note.yml')
          changed = []
          occurrences = 0
          text_extensions = {'.html', '.htm', '.md', '.txt', '.json', '.js', '.css', '.xml', '.yml', '.yaml'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              count = text.count(sentence)
              if not count:
                  continue

              occurrences += count
              updated = text.replace(wrapped, '').replace(sentence, '')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if occurrences == 0:
              raise SystemExit('The requested sentence was not found in any repository text file.')

          workflow.unlink()
          print(f'Removed {occurrences} occurrence(s) from: {", ".join(changed)}')
          PY

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Remove final price dependency note"
          git push
