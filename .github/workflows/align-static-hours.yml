name: Align static business hours

on:
  push:
    branches:
      - align-static-business-hours

permissions:
  contents: write

jobs:
  align-hours:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: align-static-business-hours
          fetch-depth: 0

      - name: Replace stale Serbian business hours
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "Pon–Pet 09:00–18:00"
          new = "Pon–Sub 08:00–17:00"
          changed = []

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(path.name)

          print(f"Updated {len(changed)} files: {', '.join(changed)}")
          if not changed:
              raise SystemExit('No stale business-hours strings found.')
          PY

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/align-static-hours.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align static business hours across Serbian pages"
          git push origin HEAD:align-static-business-hours
