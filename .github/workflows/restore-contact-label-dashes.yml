name: Restore contact label punctuation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-contact-label-dashes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore dashes in contact information text only
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/restore-contact-label-dashes.yml')
          replacements = {
              '<strong>Najbrži način</strong> <span data-cfg-phone>': '<strong>Najbrži način</strong> — <span data-cfg-phone>',
              '<strong>Fastest way</strong> <span data-cfg-phone>': '<strong>Fastest way</strong> — <span data-cfg-phone>',
              '<strong>Leggyorsabb mód</strong> <span data-cfg-phone>': '<strong>Leggyorsabb mód</strong> — <span data-cfg-phone>',
          }
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              count = 0
              for old, new in replacements.items():
                  occurrences = updated.count(old)
                  if occurrences:
                      updated = updated.replace(old, new)
                      count += occurrences
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((str(path), count))

          if not changed:
              raise SystemExit('No contact label punctuation needed restoring.')

          print('Updated files:')
          for path, count in changed:
              print(f'  {path}: {count}')

          workflow.unlink()
          PY

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Restore contact label punctuation"
          git push
